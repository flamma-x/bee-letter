name: Build assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch-assets.sh"]
permissions:
  contents: write
concurrency: assets
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg imagemagick webp
      - name: Build
        run: bash scripts/fetch-assets.sh
      - name: Commit
        run: |
          git config user.name "assets-bot"
          git config user.email "assets-bot@users.noreply.github.com"
          git add -f assets
          git diff --cached --quiet && echo "no changes" || (git commit -m "Build media assets" && git push)
